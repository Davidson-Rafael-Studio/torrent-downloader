[package]
name = "torrent-downloader"
version = "0.1.0"
edition = "2021"
description = "Multi-threaded BitTorrent game downloader with Pause/Resume, Multi-Download, Drag-and-Drop TUI, and Steam directory integration"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_bencode = "0.2"
serde_json = "1.0"
sha1 = "0.10"
tokio = { version = "1.40", features = ["full"] }
rand = "0.8"
urlencoding = "2.1"
dirs = "5.0"
chrono = "0.4"
